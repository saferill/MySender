name: Multiplatform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build_windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get -C packages/localsend_isolates/rust_builder/cargokit/build_tool

      - name: Compile Windows App
        working-directory: app
        run: flutter build windows --release

      - name: Package Portable ZIP
        run: |
          mkdir windows-output
          Compress-Archive -Path "app\build\windows\x64\runner\Release\*" -DestinationPath "windows-output\MySender-1.0.0-windows-x86-64-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Installer (.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSkipSignTool /DSkipMsixHelper support\scripts\compile_windows_exe-inno.iss
          Move-Item -Path "support\build\windows\x64\MySender-1.0.0-windows-x86-64.exe" -Destination "windows-output\MySender-1.0.0-windows-x86-64-setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: windows-output/*

  build_android:
    name: Build Android APKs & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get -C packages/localsend_isolates/rust_builder/cargokit/build_tool

      - name: Compile Split APKs
        working-directory: app
        run: flutter build apk --split-per-abi

      - name: Compile Universal APK
        working-directory: app
        run: flutter build apk

      - name: Compile App Bundle (.aab)
        working-directory: app
        run: flutter build appbundle

      - name: Collect Android Binaries
        run: |
          mkdir -p android-output
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-output/MySender-1.0.0-android-arm64-v8a.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-output/MySender-1.0.0-android-armeabi-v7a.apk
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk android-output/MySender-1.0.0-android-x86_64.apk
          cp app/build/app/outputs/flutter-apk/app-release.apk android-output/MySender-1.0.0-android-universal.apk
          cp app/build/app/outputs/bundle/release/app-release.aab android-output/MySender-1.0.0-android.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: android-output/*

  build_linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get -C packages/localsend_isolates/rust_builder/cargokit/build_tool

      - name: Compile Linux App
        working-directory: app
        run: flutter build linux --release

      - name: Create Tar.gz Bundle
        run: |
          mkdir -p linux-output
          cd app/build/linux/x64/release/bundle
          tar -czvf "$GITHUB_WORKSPACE/linux-output/MySender-1.0.0-linux-x86-64.tar.gz" *

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: linux-output/*

  build_macos:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get -C packages/localsend_isolates/rust_builder/cargokit/build_tool

      - name: Compile macOS App
        working-directory: app
        run: flutter build macos --release

      - name: Package macOS DMG & ZIP
        run: |
          mkdir -p macos-output
          cd app/build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/macos-output/MySender-1.0.0-macos-universal.zip" MySender.app
          hdiutil create -volname "MySender" -srcfolder MySender.app -ov -format UDZO "$GITHUB_WORKSPACE/macos-output/MySender-1.0.0-macos-universal.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: macos-output/*

  build_ios:
    name: Build iOS IPA (Unsigned / Sideload)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Dependencies
        run: |
          flutter pub get
          flutter pub get -C packages/localsend_isolates/rust_builder/cargokit/build_tool

      - name: Compile iOS App (Unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p ios-output/Payload
          cp -r app/build/ios/iphoneos/Runner.app ios-output/Payload/
          cd ios-output
          zip -r MySender-1.0.0-ios.ipa Payload
          rm -rf Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: ios-output/*.ipa

  publish_release:
    name: Publish GitHub Release
    needs: [build_windows, build_android, build_linux, build_macos, build_ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release-assets

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MySender ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## What's Changed
            - Multi-platform release (${{ github.ref_name }})
            - Secure local P2P file sharing across devices
            - Optimized builds for Windows, Android, Linux, macOS, and iOS

            ### Downloads:
            - **Windows**: Setup installer (.exe) & Portable (.zip)
            - **Android**: APKs (arm64, armv7, x86_64, universal) & AAB
            - **Linux**: Standalone archive (.tar.gz)
            - **macOS**: DMG installer & Portable ZIP
            - **iOS**: Unsigned IPA (for Sideloading / AltStore)

            **Full Changelog**: https://github.com/saferill/MySender/commits/${{ github.ref_name }}
