name: Release MySender v1.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build_windows:
    name: Build Windows (EXE & ZIP)
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path "app\build\windows\x64\runner\Release\*" -DestinationPath "MySender-1.0.0-windows-x86-64.zip" -Force

      - name: Build Inno Setup Installer
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null
          iscc /DSkipSignTool /DSkipMsixHelper "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss
          Move-Item -Path "${{ runner.temp }}\inno-result\mysender.exe" -Destination "MySender-1.0.0-windows-x86-64.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: |
            MySender-1.0.0-windows-x86-64.exe
            MySender-1.0.0-windows-x86-64.zip

  build_android:
    name: Build Android (Split APKs & Universal)
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build dir
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build Split per-ABI APKs
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi --obfuscate --split-debug-info=symbols

      - name: Build Universal APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --obfuscate --split-debug-info=symbols

      - name: Rename APKs
        run: |
          mkdir -p android-output
          cp ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-output/MySender-1.0.0-android-arm64-v8a.apk
          cp ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-output/MySender-1.0.0-android-armeabi-v7a.apk
          cp ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk android-output/MySender-1.0.0-android-x86_64.apk
          cp ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-release.apk android-output/MySender-1.0.0-android-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-binaries
          path: android-output/*.apk

  build_linux:
    name: Build Linux (AppImage, DEB, Tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile Linux
        working-directory: app
        run: flutter build linux

      - name: Create Tar.gz & Packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/linux-output"
          cd app/build/linux/x64/release/bundle
          tar -czvf "$GITHUB_WORKSPACE/linux-output/MySender-1.0.0-linux-x86-64.tar.gz" *

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-binaries
          path: linux-output/*

  publish_release:
    name: Publish GitHub Release
    needs: [build_windows, build_android, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v6
        with:
          name: android-binaries
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: linux-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MySender 1.0.0"
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## What's Changed
            - Initial release of MySender (v1.0.0)
            - Secure local P2P file sharing across devices
            - Optimized lightweight builds for Android, Windows, and Linux

            ### Downloads:
            - **Windows**: Setup installer (.exe) & Portable (.zip)
            - **Android**: APKs for arm64, armv7, x86_64, and universal
            - **Linux**: Standalone archive (.tar.gz)

            **Full Changelog**: https://github.com/saferill/MySender/commits/v1.0.0
